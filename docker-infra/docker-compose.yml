# infra/docker-compose.yml
#
# Infraestrutura local: PostgreSQL 16 + LocalStack (SQS) + bootstrap das filas.
#
# Uso:
#   cd infra
#   docker compose up -d
#   docker compose logs -f sqs-bootstrap   # acompanhar a criação das filas
#   docker compose down                     # parar (dados persistem no volume)
#   docker compose down -v                  # parar + apagar dados
#
# Verificação:
#   docker compose exec postgres pg_isready -U wagering
#   docker compose exec localstack awslocal sqs list-queues --region us-east-1

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16
    container_name: wagering-postgres
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Aplica as migrations automaticamente no primeiro boot.
      # O container postgres executa .sql em /docker-entrypoint-initdb.d/
      # apenas quando o data directory está vazio (primeira inicialização).
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─── LocalStack (SQS) ────────────────────────────────────────────────────
  #
  # Persistência: EFÊMERA (intencional).
  # O LocalStack mantém o estado do SQS em RAM por padrão; este compose não
  # configura PERSISTENCE_FILE nem volume, então filas e mensagens somem em
  # qualquer stop/recreate (docker stop, compose down, kill). Isso é ok para o
  # desafio: o Postgres (volume postgres-data) é a fonte de verdade e persiste;
  # as filas são recriadas pelo sqs-bootstrap a cada `up`; e o teste de crash
  # recovery depende justamente de o estado de memória cair, não de o broker
  # sobreviver. Se persistência for necessária, montar volume em
  # /var/lib/localstack + PERSISTENCE_FILE/PERSISTENCE_INTERVAL.

  localstack:
    image: localstack/localstack:3.8.0
    container_name: wagering-localstack
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      SERVICES: sqs
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues --region us-east-1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ─── Bootstrap das filas SQS ─────────────────────────────────────────────
  #
  # One-shot: cria as duas filas FIFO + redrive policy, e sai.
  # Rode manualmente se precisar recriar:
  #   docker compose run --rm sqs-bootstrap

  sqs-bootstrap:
    image: amazon/aws-cli:latest
    container_name: wagering-sqs-bootstrap
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      # A imagem amazon/aws-cli lê AWS_ENDPOINT_URL nativamente.
      AWS_ENDPOINT_URL: http://localstack:4566
    # Sobrescreve o entrypoint (que é "aws") para rodar o script de shell.
    entrypoint: ["/bin/sh"]
    volumes:
      - ./sqs-bootstrap.sh:/sqs-bootstrap.sh:ro
    command: ["/sqs-bootstrap.sh"]
    restart: "no"

  # ─── Backend (Jungle Gaming) ─────────────────────────────────────────────
  #
  # 1 processo por container. Escala horizontal = múltiplos containers.
  # Para o teste de ≥3 instâncias (seção 13.4):
  #   docker compose up -d backend-1 backend-2 backend-3
  #
  # Cada container tem sua própria porta exposta (3000, 3001, 3002).
  # Os clientes Go usam round-robin entre as portas.

  backend-1:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: wagering-backend-1
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      # As filas devem existir antes do consumer subir (ReceiveMessage).
      sqs-bootstrap:
        condition: service_completed_successfully
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://wagering:wagering@postgres:5432/wagering
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      SQS_CONSUMER_NAME: backend-1
      AWS_REGION: us-east-1
      INSTANCE_ID: inst-1
    ports:
      - "3000:3000"
    restart: unless-stopped

  backend-2:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: wagering-backend-2
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      # As filas devem existir antes do consumer subir (ReceiveMessage).
      sqs-bootstrap:
        condition: service_completed_successfully
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://wagering:wagering@postgres:5432/wagering
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      SQS_CONSUMER_NAME: backend-2
      AWS_REGION: us-east-1
      INSTANCE_ID: inst-2
    ports:
      - "3001:3000"
    restart: unless-stopped

  backend-3:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: wagering-backend-3
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      # As filas devem existir antes do consumer subir (ReceiveMessage).
      sqs-bootstrap:
        condition: service_completed_successfully
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://wagering:wagering@postgres:5432/wagering
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      SQS_CONSUMER_NAME: backend-3
      AWS_REGION: us-east-1
      INSTANCE_ID: inst-3
    ports:
      - "3002:3000"
    restart: unless-stopped

  backend-4:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: wagering-backend-4
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      # As filas devem existir antes do consumer subir (ReceiveMessage).
      sqs-bootstrap:
        condition: service_completed_successfully
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://wagering:wagering@postgres:5432/wagering
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      SQS_CONSUMER_NAME: backend-4
      AWS_REGION: us-east-1
      INSTANCE_ID: inst-4
    ports:
      - "3003:3000"
    restart: unless-stopped

  # ─── NGINX Load Balancer ────────────────────────────────────────────────
  #
  # Distribui a carga HTTP entre as 4 instâncias do backend (round-robin).
  # O client Go conecta em http://localhost:8080 (porta única).
  #
  # O backend adiciona o header `X-Instance-Id` (ex.: "inst-1") em toda
  # resposta — o client lê esse header e agrega a distribuição por
  # instância no relatório final.
  #
  # Para auditar a distribuição: docker compose logs nginx | grep inst-

  nginx:
    image: nginx:1.27-alpine
    container_name: wagering-nginx
    depends_on:
      backend-1:
        condition: service_started
      backend-2:
        condition: service_started
      backend-3:
        condition: service_started
      backend-4:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  postgres-data:
