# infra/nginx.conf
#
# Load balancer NGINX na frente das 4 instâncias do backend.
#
# Algoritmo: round-robin (default do NGINX).
# Cada request é distribuído sequencialmente entre os 4 backends.
#
# O backend adiciona o header `X-Instance-Id` (ex.: "inst-1") em toda
# resposta — o client Go lê esse header e agrega a distribuição por
# instância no relatório final.
#
# Para trocar o algoritmo:
#   - least_conn:  adiciona "least_conn;" no bloco upstream
#   - ip_hash:     adiciona "ip_hash;" no bloco upstream (sticky por IP)

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    # Aumentado de 1024 para 4096 para suportar ~5000 conexões concorrentes
    # durante o stress test (5 tabelas × ~1000 players/round).
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    upstream backend_pool {
        # Round-robin entre as 4 instâncias do backend.
        # Cada container escuta na porta 3000 internamente.
        server backend-1:3000 max_fails=3 fail_timeout=10s;
        server backend-2:3000 max_fails=3 fail_timeout=10s;
        server backend-3:3000 max_fails=3 fail_timeout=10s;
        server backend-4:3000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 8080;
        server_name _;

        # Access log — útil para auditar a distribuição de carga.
        # Formato: timestamp, IP client, método, URL, status, bytes,
        #          tempo de request, upstream que atendeu.
        access_log /var/log/nginx/access.log;

        location / {
            proxy_pass http://backend_pool;

            # Headers de proxy
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Keep-alive para o upstream: reutiliza conexões TCP com os backends
            # em vez de abrir/fechar uma conexão por request. Sem isso, o churn
            # de conexões sob carga alta causa "connection reset by peer" no
            # client (observado nos testes de stress).
            # (upstream_keepalive é do nginx-plus; no OSS, o keep-alive para o
            # upstream é controlado apenas por proxy_http_version + Connection.)
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Se um backend falhar, o NGINX tenta o próximo automaticamente.
            # O header X-Instance-Id na resposta identifica qual instância
            # efetivamente processou o request.
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
